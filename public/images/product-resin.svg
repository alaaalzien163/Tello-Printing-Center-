<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Amber 3D printing resin</title>
  <desc id="desc">A dark premium resin bottle beside a build platform with a detailed printed component.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071321"/><stop offset=".55" stop-color="#0d1e2f"/><stop offset="1" stop-color="#182c3d"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f59e0b" stop-opacity=".28"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".3"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbbf24" stop-opacity=".95"/><stop offset=".5" stop-color="#d97706"/><stop offset="1" stop-color="#7c2d12"/>
    </linearGradient>
    <linearGradient id="bottle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1b2a36"/><stop offset=".3" stop-color="#2d4150"/><stop offset=".65" stop-color="#12212d"/><stop offset="1" stop-color="#0a1621"/>
    </linearGradient>
    <linearGradient id="part" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde68a"/><stop offset="1" stop-color="#b45309"/>
    </linearGradient>
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M46 0H0V46" fill="none" stroke="#7fb9d8" stroke-opacity=".07"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="28" stdDeviation="24" flood-color="#010812" flood-opacity=".8"/>
    </filter>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#grid)"/>
  <circle cx="420" cy="400" r="330" fill="url(#glow)"/>
  <circle cx="830" cy="430" r="330" fill="url(#cyanGlow)"/>
  <ellipse cx="600" cy="748" rx="390" ry="46" fill="#010812" opacity=".8" filter="url(#blur)"/>

  <g filter="url(#shadow)">
    <!-- bottle -->
    <path d="M320 686V402c0-24 12-38 34-50 12-6 18-18 18-40v-46h94v46c0 22 6 34 18 40 22 12 34 26 34 50v284z" fill="url(#bottle)" stroke="#3e6179" stroke-width="2"/>
    <path d="M352 430h150v196H352z" fill="url(#amber)" opacity=".88"/>
    <path d="M352 472h150M352 566h150" stroke="#fff7ed" stroke-opacity=".18" stroke-width="2"/>
    <rect x="370" y="232" width="114" height="54" rx="8" fill="#152532" stroke="#426b84"/>
    <path d="M390 250h74M390 266h48" stroke="#67e8f9" stroke-opacity=".5" stroke-width="2"/>
    <path d="M336 392h176" stroke="#67e8f9" stroke-opacity=".35" stroke-width="2"/>
    <path d="M352 640c46 14 102 14 150 0v46H352z" fill="#d97706" opacity=".8"/>
    <path d="M330 698h190" stroke="#fbbf24" stroke-opacity=".4" stroke-width="2"/>
    <!-- cap -->
    <rect x="382" y="176" width="90" height="62" rx="9" fill="#0b1b2a" stroke="#39637f"/>
    <path d="M396 190v34M414 190v34M432 190v34M450 190v34" stroke="#2f5771" stroke-width="3"/>

    <!-- build platform / printed part -->
    <path d="M688 702l104-38 136 30-108 44z" fill="#10273a" stroke="#37617e"/>
    <rect x="716" y="654" width="186" height="16" rx="5" fill="#1e3b52" stroke="#4d7d9b"/>
    <g>
      <path d="M772 654l16-64h74l18 64z" fill="#123a55" stroke="#2f83ab"/>
      <path d="M790 590l10-40h54l12 40z" fill="url(#part)" opacity=".95"/>
      <path d="M804 550l8-36h34l10 36z" fill="#fcd34d" opacity=".88"/>
      <path d="M818 514l5-26h16l7 26z" fill="#fef3c7"/>
      <path d="M760 630h126M784 594h90M800 554h60" stroke="#fef3c7" stroke-opacity=".28"/>
      <circle cx="832" cy="646" r="5" fill="#67e8f9"/>
    </g>
    <path d="M716 670h186" stroke="#67e8f9" stroke-opacity=".3" stroke-width="2"/>
    <path d="M886 654l50 18" stroke="#4b7897" stroke-opacity=".5" stroke-width="2"/>
  </g>

  <g fill="none" stroke="#fbbf24" stroke-opacity=".28">
    <circle cx="958" cy="248" r="30"/><circle cx="958" cy="248" r="3" fill="#fbbf24"/>
    <path d="M958 218v-22M958 278v22M928 248h-22M988 248h22"/>
  </g>
  <g fill="#67e8f9">
    <circle cx="240" cy="300" r="3" opacity=".5"/>
    <circle cx="1060" cy="600" r="2.5" opacity=".5"/>
    <circle cx="266" cy="640" r="2" opacity=".4"/>
  </g>
</svg>
