<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">3D printer nozzles and precision accessories</title>
  <desc id="desc">Hardened steel nozzles and extruder components arranged on a dark technical surface.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071321"/><stop offset=".55" stop-color="#0c1e30"/><stop offset="1" stop-color="#132f45"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".3"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6b4b1f"/><stop offset=".35" stop-color="#e7c27a"/><stop offset=".6" stop-color="#a87b34"/><stop offset="1" stop-color="#5b3f18"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3a4c5c"/><stop offset=".35" stop-color="#d3e1eb"/><stop offset=".6" stop-color="#6e8496"/><stop offset="1" stop-color="#2b3b49"/>
    </linearGradient>
    <linearGradient id="surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d2336"/><stop offset="1" stop-color="#071220"/>
    </linearGradient>
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M46 0H0V46" fill="none" stroke="#7fb9d8" stroke-opacity=".07"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#010812" flood-opacity=".8"/>
    </filter>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#grid)"/>
  <circle cx="610" cy="400" r="430" fill="url(#glow)"/>
  <path d="M60 660h1080l54 92H6z" fill="url(#surface)" stroke="#2a4d67"/>
  <ellipse cx="610" cy="720" rx="440" ry="46" fill="#010812" opacity=".65" filter="url(#blur)"/>

  <g filter="url(#shadow)">
    <!-- nozzle hero -->
    <g transform="translate(600 250) rotate(24)">
      <rect x="-34" y="0" width="68" height="42" rx="8" fill="url(#steel)" stroke="#a8bfce" stroke-opacity=".4"/>
      <path d="M-34 42h68l-8 196h-52z" fill="url(#brass)"/>
      <path d="M-26 238h52l-14 40h-24z" fill="url(#steel)"/>
      <path d="M-17 278h34l-9 32h-16z" fill="#c8d6e0"/>
      <circle r="9" cy="102" fill="#081521" stroke="#f0d6a1" stroke-opacity=".4"/>
      <path d="M-34 60h68M-32 84h64" stroke="#fff2d6" stroke-opacity=".25" stroke-width="2"/>
    </g>

    <!-- nozzle set row -->
    <g transform="translate(0 90)">
      <g transform="translate(280 560) rotate(-18)">
        <rect x="-18" y="0" width="36" height="24" rx="5" fill="url(#steel)"/>
        <path d="M-18 24h36l-5 86h-26z" fill="url(#brass)"/>
        <path d="M-11 110h22l-7 20h-8z" fill="url(#steel)"/>
      </g>
      <g transform="translate(410 600) rotate(-8) scale(.9)">
        <rect x="-18" y="0" width="36" height="24" rx="5" fill="url(#steel)"/>
        <path d="M-18 24h36l-5 86h-26z" fill="url(#brass)"/>
        <path d="M-11 110h22l-7 20h-8z" fill="url(#steel)"/>
      </g>
      <g transform="translate(870 570) rotate(15) scale(1.05)">
        <rect x="-18" y="0" width="36" height="24" rx="5" fill="url(#steel)"/>
        <path d="M-18 24h36l-5 86h-26z" fill="url(#brass)"/>
        <path d="M-11 110h22l-7 20h-8z" fill="url(#steel)"/>
      </g>
      <!-- extruder gear -->
      <g transform="translate(990 470)">
        <circle r="72" fill="url(#steel)" stroke="#cfdde7" stroke-opacity=".35"/>
        <circle r="34" fill="#0a1a29" stroke="#8fa8b8" stroke-opacity=".6"/>
        <circle r="11" fill="#07131f" stroke="#cfe4ef" stroke-opacity=".4"/>
        <path d="M-72 0H72M0-72V72" stroke="#0b1c2b" stroke-opacity=".5" stroke-width="4"/>
      </g>
    </g>

    <!-- tool case -->
    <g transform="translate(180 600)">
      <path d="M0 36l110-26 220 30-110 32z" fill="#143248" stroke="#3e6b89"/>
      <path d="M0 36v95l220 35V72z" fill="#0c2032" stroke="#3e6b89"/>
      <path d="M220 72v94l110-32V40z" fill="#091a29" stroke="#3e6b89"/>
      <path d="M34 70l150 22M34 92l150 22M34 114l150 22" stroke="#67e8f9" stroke-opacity=".18" stroke-width="3"/>
    </g>
  </g>
  <g fill="none" stroke="#67e8f9" stroke-opacity=".3">
    <path d="M160 250h-42v42M1016 260h42v42"/>
    <circle cx="1034" cy="650" r="22"/>
  </g>
</svg>
