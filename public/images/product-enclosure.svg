<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Custom 3D printed electronics enclosure</title>
  <desc id="desc">A matte black precision printed enclosure with ventilation slots and a cyan status detail.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071321"/><stop offset=".55" stop-color="#0c1e30"/><stop offset="1" stop-color="#132f45"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".3"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c4358"/><stop offset=".6" stop-color="#172e42"/><stop offset="1" stop-color="#0c1d2d"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#162b3e"/><stop offset="1" stop-color="#081522"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d2032"/><stop offset="1" stop-color="#172f43"/>
    </linearGradient>
    <linearGradient id="surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d2336"/><stop offset="1" stop-color="#071220"/>
    </linearGradient>
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M46 0H0V46" fill="none" stroke="#7fb9d8" stroke-opacity=".07"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="30" stdDeviation="24" flood-color="#010812" flood-opacity=".8"/>
    </filter>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#grid)"/>
  <circle cx="610" cy="400" r="430" fill="url(#glow)"/>
  <path d="M80 700h1040l60 90H20z" fill="url(#surface)" stroke="#2a4d67"/>
  <ellipse cx="610" cy="740" rx="410" ry="48" fill="#010812" opacity=".7" filter="url(#blur)"/>

  <g filter="url(#shadow)">
    <g transform="translate(280 330)">
      <!-- isometric enclosure -->
      <path d="M0 150L300 20l320 90L320 250z" fill="url(#top)" stroke="#3f6b89" stroke-width="2"/>
      <path d="M0 150v260l320 120V250z" fill="url(#front)" stroke="#3f6b89" stroke-width="2"/>
      <path d="M320 250v280l300-140V110z" fill="url(#side)" stroke="#3f6b89" stroke-width="2"/>
      <!-- top details -->
      <path d="M64 152l240-102 242 70-240 106z" fill="none" stroke="#67e8f9" stroke-opacity=".18"/>
      <path d="M126 150l194-82 190 56-192 84z" fill="#0f2334" stroke="#3b6582" stroke-opacity=".8"/>
      <path d="M160 154l160-68 154 46-158 70z" fill="#0b1b2a"/>
      <path d="M190 158l130-56 128 38-130 58z" fill="#071522"/>
      <!-- ventilation slots -->
      <g fill="#050f19" stroke="#2b506b" stroke-opacity=".7">
        <rect x="56" y="230" width="210" height="13" rx="6" transform="skewY(20.5)"/>
        <rect x="56" y="270" width="210" height="13" rx="6" transform="skewY(20.5)"/>
        <rect x="56" y="310" width="210" height="13" rx="6" transform="skewY(20.5)"/>
        <rect x="56" y="350" width="210" height="13" rx="6" transform="skewY(20.5)"/>
      </g>
      <!-- side vents -->
      <g fill="#06121d" stroke="#2b506b" stroke-opacity=".5">
        <rect x="410" y="222" width="12" height="108" rx="5" transform="skewY(-24)"/>
        <rect x="448" y="204" width="12" height="108" rx="5" transform="skewY(-24)"/>
        <rect x="486" y="186" width="12" height="108" rx="5" transform="skewY(-24)"/>
      </g>
      <!-- status light and port -->
      <rect x="270" y="330" width="52" height="12" rx="6" fill="#22d3ee" opacity=".85"/>
      <rect x="270" y="360" width="120" height="44" rx="8" fill="#050f19" stroke="#2b506b"/>
      <circle cx="292" cy="382" r="6" fill="#22d3ee" opacity=".7"/>
      <circle cx="316" cy="382" r="6" fill="#2b506b"/>
      <path d="M360 382h18" stroke="#4b7897" stroke-width="2"/>
      <!-- mounting points -->
      <g fill="#07131f" stroke="#4c80a0">
        <circle cx="40" cy="190" r="10"/>
        <circle cx="250" cy="278" r="9"/>
      </g>
    </g>
  </g>
  <g fill="none" stroke="#67e8f9" stroke-opacity=".3">
    <path d="M180 280h-40v40M1000 590h40v40"/>
    <circle cx="1006" cy="230" r="24"/>
  </g>
</svg>
