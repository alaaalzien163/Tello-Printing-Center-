<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Precision inspection of a 3D printed part</title>
  <desc id="desc">A technical close-up of digital calipers measuring a precision printed lattice component on a dark workbench.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071321"/><stop offset=".6" stop-color="#0c1e30"/><stop offset="1" stop-color="#102a3f"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".3"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#11283c"/><stop offset="1" stop-color="#071220"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#33485a"/><stop offset=".4" stop-color="#c9d9e4"/><stop offset=".7" stop-color="#6d8192"/><stop offset="1" stop-color="#2b3c4a"/>
    </linearGradient>
    <linearGradient id="part" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9"/><stop offset=".5" stop-color="#1d6f96"/><stop offset="1" stop-color="#0b3a54"/>
    </linearGradient>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#7fb9d8" stroke-opacity=".08"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="30" stdDeviation="26" flood-color="#010812" flood-opacity=".8"/>
    </filter>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#grid)"/>
  <circle cx="640" cy="380" r="450" fill="url(#glow)"/>
  <path d="M0 640h1200v260H0z" fill="url(#surface)"/>
  <path d="M0 640h1200" stroke="#3b6987" stroke-opacity=".6"/>
  <path d="M0 690h1200M0 760h1200" stroke="#3b6987" stroke-opacity=".12"/>
  <ellipse cx="610" cy="700" rx="360" ry="48" fill="#010812" opacity=".7" filter="url(#blur)"/>

  <g filter="url(#shadow)">
    <!-- component under inspection -->
    <g transform="translate(360 330)">
      <path d="M0 120L140 50l190 72-140 76z" fill="#1b425e" stroke="#4c80a0"/>
      <path d="M0 120v140l190 82V198z" fill="url(#part)" opacity=".92"/>
      <path d="M330 122v144l-140 76V198z" fill="#123a52" stroke="#4c80a0"/>
      <path d="M0 120l140-70 190 72M0 160l140-70 190 72M0 200l140-70 190 72M0 240l140-70 190 72" fill="none" stroke="#a5f3fc" stroke-opacity=".3"/>
      <path d="M70 85v140M140 50v212M210 85v140M70 225v55M210 225v55" stroke="#a5f3fc" stroke-opacity=".18"/>
      <path d="M0 120v140M140 190v150M330 122v144" stroke="#67e8f9" stroke-opacity=".35" stroke-width="2"/>
    </g>

    <!-- caliper -->
    <g transform="translate(250 250) rotate(-8)">
      <rect x="0" y="0" width="700" height="54" rx="12" fill="url(#steel)" stroke="#dbe9f2" stroke-opacity=".3"/>
      <rect x="0" y="54" width="250" height="84" rx="10" fill="#233847" stroke="#a9c0cf" stroke-opacity=".35"/>
      <rect x="70" y="74" width="100" height="34" rx="5" fill="#0a1a28" stroke="#6e8fa5"/>
      <path d="M82 86h74M82 96h48" stroke="#67e8f9" stroke-opacity=".6" stroke-width="2"/>
      <rect x="546" y="20" width="88" height="100" rx="8" fill="#2a4254" stroke="#c6d9e5" stroke-opacity=".3"/>
      <path d="M616 120h34v64h-34zM616 184l-16 82h80l-18-82z" fill="#5e7789"/>
      <path d="M536 120l-26 160h40l22-160z" fill="#b9ccd9"/>
      <path d="M510 280h40" stroke="#e5f2fa" stroke-width="3"/>
      <path d="M0 27h700" stroke="#f0f8fc" stroke-opacity=".2"/>
      <g stroke="#e8f4fb" stroke-opacity=".45">
        <path d="M220 0v18M260 0v12M300 0v18M340 0v12M380 0v18M420 0v12M460 0v18M500 0v12"/>
      </g>
    </g>

    <!-- measurement callout -->
    <g fill="none" stroke="#67e8f9" stroke-opacity=".7">
      <path d="M512 198v-58h110"/>
      <path d="M650 198v-58h-28"/>
      <path d="M560 140v-28M612 140v-28" stroke-dasharray="4 4"/>
      <circle cx="622" cy="140" r="3" fill="#67e8f9"/>
    </g>

    <!-- secondary parts -->
    <g transform="translate(780 480)">
      <circle r="54" fill="#1c3d55" stroke="#4c80a0"/>
      <circle r="22" fill="#0a1a28" stroke="#67e8f9" stroke-opacity=".6"/>
      <path d="M-54 0H54M0-54V54" stroke="#67e8f9" stroke-opacity=".2"/>
    </g>
    <g transform="translate(280 560)">
      <path d="M0 30l60-24 70 26-60 26z" fill="#17384f" stroke="#4c80a0"/>
      <path d="M0 30v44l70 28V56z" fill="#0f283b" stroke="#4c80a0"/>
      <path d="M130 32v46l-60 24V56z" fill="#0a1f31" stroke="#4c80a0"/>
    </g>
  </g>
  <g fill="none" stroke="#67e8f9" stroke-opacity=".28">
    <path d="M180 200h-48v48M1010 600h48v48"/>
    <circle cx="1020" cy="240" r="22"/>
  </g>
</svg>
