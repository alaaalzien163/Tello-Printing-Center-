<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Industrial flatbed printing machine</title>
  <desc id="desc">A wide industrial flatbed printer with a precision gantry and cyan status lighting.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071321"/><stop offset=".55" stop-color="#0b1d2e"/><stop offset="1" stop-color="#102b40"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity=".32"/><stop offset="1" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#223c53"/><stop offset=".5" stop-color="#122a3e"/><stop offset="1" stop-color="#081828"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2b506b"/><stop offset=".5" stop-color="#5a8eac"/><stop offset="1" stop-color="#2b506b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".15"/><stop offset=".5" stop-color="#a5f3fc"/><stop offset="1" stop-color="#22d3ee" stop-opacity=".15"/>
    </linearGradient>
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M46 0H0V46" fill="none" stroke="#7fb9d8" stroke-opacity=".08"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="20"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="32" stdDeviation="26" flood-color="#010812" flood-opacity=".8"/>
    </filter>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#grid)"/>
  <circle cx="650" cy="340" r="480" fill="url(#glow)"/>
  <ellipse cx="620" cy="760" rx="430" ry="44" fill="#010812" opacity=".85" filter="url(#blur)"/>

  <g filter="url(#shadow)">
    <path d="M214 680h842l56 88H158z" fill="#081727" stroke="#25455f"/>
    <rect x="214" y="560" width="842" height="140" rx="14" fill="url(#body)" stroke="#2f5673" stroke-width="2"/>
    <rect x="250" y="576" width="770" height="90" rx="8" fill="#0a1c2c" stroke="#335a76"/>
    <path d="M276 606h718M276 636h718" stroke="#2a506d" stroke-dasharray="5 10" stroke-opacity=".7"/>
    <rect x="314" y="664" width="660" height="6" rx="3" fill="url(#accent)"/>
    <rect x="214" y="508" width="842" height="54" rx="10" fill="#162f45" stroke="#3c6886"/>
    <rect x="214" y="508" width="842" height="14" rx="7" fill="url(#rail)"/>
    <rect x="700" y="300" width="150" height="218" rx="12" fill="#152d42" stroke="#4a7b99"/>
    <rect x="724" y="326" width="102" height="64" rx="7" fill="#082032" stroke="#6ab3d2"/>
    <path d="M746 350h58M746 366h38" stroke="#22d3ee" stroke-opacity=".7" stroke-width="2"/>
    <g stroke="#5e93b1" stroke-opacity=".6">
      <path d="M776 390v46M758 436h36" stroke-width="3"/>
      <rect x="748" y="444" width="56" height="34" rx="5" fill="#0c2337"/>
      <path d="M760 478h32" stroke="#22d3ee" stroke-opacity=".6"/>
    </g>
    <rect x="240" y="294" width="446" height="214" rx="12" fill="#0d2235" stroke="#345d7a"/>
    <path d="M266 320h394M266 348h394M266 376h394M266 404h394M266 432h394M266 460h394" stroke="#3b6c8a" stroke-opacity=".25"/>
    <rect x="286" y="334" width="210" height="92" rx="6" fill="#102d44" stroke="#2e6b8c"/>
    <path d="M310 398c20-42 42-30 60-58s40 4 58-22" fill="none" stroke="#67e8f9" stroke-width="3"/>
    <circle cx="428" cy="318" r="7" fill="#22d3ee"/>
    <rect x="292" y="446" width="86" height="8" rx="4" fill="#22d3ee" opacity=".5"/>
  </g>
  <g fill="none" stroke="#67e8f9" stroke-opacity=".3">
    <path d="M170 620h-50M1030 620h50M600 560v-60"/>
    <circle cx="600" cy="474" r="18"/>
    <circle cx="600" cy="474" r="3" fill="#67e8f9"/>
  </g>
</svg>
