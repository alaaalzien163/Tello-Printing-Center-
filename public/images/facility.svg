<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Tello printing facility</title>
  <desc id="desc">A row of professional 3D printers in a modern, dark production facility with cyan lighting.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#06101d"/><stop offset=".55" stop-color="#0a1b2c"/><stop offset="1" stop-color="#0e2437"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="55%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".28"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d2032"/><stop offset="1" stop-color="#050e18"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d3549"/><stop offset="1" stop-color="#0a1928"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2b42"/><stop offset=".6" stop-color="#071a29"/><stop offset="1" stop-color="#0e3149"/>
    </linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9" stop-opacity=".1"/><stop offset=".5" stop-color="#a5f3fc" stop-opacity=".8"/><stop offset="1" stop-color="#67e8f9" stop-opacity=".1"/>
    </linearGradient>
    <pattern id="grid" width="54" height="54" patternUnits="userSpaceOnUse">
      <path d="M54 0H0V54" fill="none" stroke="#7fb9d8" stroke-opacity=".07"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="26"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>
  <circle cx="800" cy="380" r="650" fill="url(#glow)"/>
  <!-- ceiling lights -->
  <g>
    <rect x="240" y="80" width="360" height="6" rx="3" fill="url(#light)"/>
    <rect x="1000" y="80" width="360" height="6" rx="3" fill="url(#light)"/>
    <path d="M240 86l-120 380h520L560 86zM1000 86l-100 380h520L1420 86z" fill="#67e8f9" opacity=".025"/>
  </g>
  <path d="M0 720h1600v280H0z" fill="url(#floor)"/>
  <path d="M0 720h1600" stroke="#4b7b99" stroke-opacity=".25"/>
  <path d="M0 780h1600M0 860h1600M0 950h1600" stroke="#4b7b99" stroke-opacity=".1"/>
  <ellipse cx="800" cy="800" rx="620" ry="60" fill="#010812" opacity=".7" filter="url(#blur)"/>

  <!-- printer row: back three -->
  <g opacity=".65">
    <g transform="translate(390 420) scale(.72)">
      <rect x="0" y="0" width="260" height="380" rx="14" fill="url(#body)" stroke="#2e5068"/>
      <rect x="18" y="54" width="224" height="244" rx="8" fill="url(#glass)" stroke="#3d6884"/>
      <rect x="0" y="340" width="260" height="20" rx="8" fill="#081624" stroke="#2a4a62"/>
      <rect x="30" y="300" width="160" height="4" rx="2" fill="url(#light)"/>
      <circle cx="52" cy="34" r="4" fill="#22d3ee"/>
    </g>
    <g transform="translate(710 400) scale(.8)">
      <rect x="0" y="0" width="260" height="380" rx="14" fill="url(#body)" stroke="#2e5068"/>
      <rect x="18" y="54" width="224" height="244" rx="8" fill="url(#glass)" stroke="#3d6884"/>
      <rect x="0" y="340" width="260" height="20" rx="8" fill="#081624" stroke="#2a4a62"/>
      <rect x="30" y="300" width="160" height="4" rx="2" fill="url(#light)"/>
      <circle cx="52" cy="34" r="4" fill="#22d3ee"/>
    </g>
    <g transform="translate(1040 430) scale(.7)">
      <rect x="0" y="0" width="260" height="380" rx="14" fill="url(#body)" stroke="#2e5068"/>
      <rect x="18" y="54" width="224" height="244" rx="8" fill="url(#glass)" stroke="#3d6884"/>
      <rect x="0" y="340" width="260" height="20" rx="8" fill="#081624" stroke="#2a4a62"/>
      <rect x="30" y="300" width="160" height="4" rx="2" fill="url(#light)"/>
      <circle cx="52" cy="34" r="4" fill="#22d3ee"/>
    </g>
  </g>

  <!-- foreground printer -->
  <g>
    <ellipse cx="460" cy="930" rx="290" ry="42" fill="#010812" opacity=".8" filter="url(#blur)"/>
    <g transform="translate(230 480)">
      <rect x="0" y="0" width="430" height="470" rx="18" fill="url(#body)" stroke="#35617f" stroke-width="2"/>
      <rect x="0" y="0" width="430" height="52" rx="18" fill="#1c354a" stroke="#3d6a88"/>
      <rect x="28" y="78" width="374" height="300" rx="10" fill="url(#glass)" stroke="#4a83a3"/>
      <path d="M44 94h342" stroke="#bae6fd" stroke-opacity=".2"/>
      <rect x="50" y="220" width="12" height="140" rx="4" fill="#1e425d"/>
      <rect x="368" y="220" width="12" height="140" rx="4" fill="#1e425d"/>
      <rect x="50" y="224" width="330" height="12" rx="4" fill="#2f5b79"/>
      <rect x="196" y="232" width="42" height="46" rx="6" fill="#0b2135" stroke="#6bbad7"/>
      <circle cx="217" cy="252" r="4" fill="#22d3ee"/>
      <rect x="78" y="340" width="274" height="18" rx="5" fill="#1b354b" stroke="#4a7b99"/>
      <path d="M140 340h150l-12-26H152z" fill="#0f3d59" stroke="#2f8bb6"/>
      <path d="M156 314h118l-10-24H166z" fill="#67e8f9" opacity=".85"/>
      <path d="M0 430" />
      <rect x="0" y="424" width="430" height="28" rx="12" fill="#081726" stroke="#2d506a"/>
      <rect x="34" y="404" width="230" height="5" rx="2.5" fill="url(#light)"/>
      <rect x="372" y="116" width="20" height="96" rx="5" fill="#0a1a2a" stroke="#3e6c8a"/>
      <circle cx="382" cy="136" r="4" fill="#67e8f9"/>
      <rect x="16" y="470" width="50" height="14" rx="5" fill="#06121f"/>
      <rect x="364" y="470" width="50" height="14" rx="5" fill="#06121f"/>
    </g>
  </g>

  <!-- filament rack -->
  <g transform="translate(900 540)">
    <path d="M0 0h330v250H0z" fill="#0a1928" stroke="#2b4b63"/>
    <path d="M24 24h282M24 94h282M24 164h282" stroke="#3c6582"/>
    <g fill="none" stroke-width="14">
      <circle cx="80" cy="58" r="26" stroke="#22d3ee" stroke-opacity=".8"/>
      <circle cx="160" cy="58" r="26" stroke="#e8b17a" stroke-opacity=".8"/>
      <circle cx="240" cy="58" r="26" stroke="#547491" stroke-opacity=".9"/>
      <circle cx="80" cy="128" r="26" stroke="#67e8f9" stroke-opacity=".6"/>
      <circle cx="160" cy="128" r="26" stroke="#94a3b8" stroke-opacity=".7"/>
      <circle cx="240" cy="128" r="26" stroke="#f59e0b" stroke-opacity=".6"/>
      <circle cx="80" cy="198" r="26" stroke="#0e7490" stroke-opacity=".7"/>
      <circle cx="160" cy="198" r="26" stroke="#7dd3fc" stroke-opacity=".6"/>
      <circle cx="240" cy="198" r="26" stroke="#a78bfa" stroke-opacity=".5"/>
    </g>
  </g>
  <g fill="none" stroke="#67e8f9" stroke-opacity=".25">
    <path d="M130 250h-40v40M1480 640h40v40"/>
    <circle cx="1430" cy="240" r="26"/>
  </g>
</svg>
