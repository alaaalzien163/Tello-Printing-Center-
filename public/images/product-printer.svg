<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Enclosed professional 3D printer</title>
  <desc id="desc">A graphite enclosed FDM 3D printer with a glowing cyan print chamber.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071321"/><stop offset=".6" stop-color="#0b1d2e"/><stop offset="1" stop-color="#10293f"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".4"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e3449"/><stop offset=".6" stop-color="#102338"/><stop offset="1" stop-color="#081626"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f3048"/><stop offset=".55" stop-color="#081a2a"/><stop offset="1" stop-color="#12354d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity=".2"/><stop offset=".5" stop-color="#67e8f9"/><stop offset="1" stop-color="#0ea5e9" stop-opacity=".2"/>
    </linearGradient>
    <linearGradient id="part" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a5f3fc"/><stop offset="1" stop-color="#0284c7"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#7fb9d8" stroke-opacity=".08"/>
    </pattern>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="200%">
      <feDropShadow dx="0" dy="34" stdDeviation="30" flood-color="#010811" flood-opacity=".8"/>
    </filter>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#grid)"/>
  <circle cx="600" cy="390" r="420" fill="url(#glow)"/>
  <ellipse cx="600" cy="790" rx="340" ry="38" fill="#010812" opacity=".8" filter="url(#blur)"/>
  <g filter="url(#shadow)">
    <rect x="288" y="168" width="624" height="558" rx="34" fill="url(#body)" stroke="#335a79" stroke-width="2"/>
    <rect x="288" y="168" width="624" height="58" rx="28" fill="#1c354c" stroke="#3e6c8b" stroke-width="1.5"/>
    <rect x="322" y="254" width="556" height="384" rx="18" fill="url(#glass)" stroke="#447b9d" stroke-width="1.5"/>
    <path d="M338 274h524" stroke="#bae6fd" stroke-opacity=".2" stroke-width="2"/>
    <rect x="288" y="690" width="624" height="36" rx="18" fill="#0b1b2b" stroke="#2d506a"/>
    <rect x="340" y="676" width="520" height="4" rx="2" fill="url(#accent)"/>
    <rect x="340" y="700" width="150" height="7" rx="3.5" fill="#22d3ee" opacity=".55"/>
    <rect x="890" y="300" width="26" height="128" rx="7" fill="#0a1929" stroke="#3d6a89"/>
    <circle cx="903" cy="326" r="5" fill="#67e8f9"/>
    <circle cx="903" cy="348" r="3" fill="#4b7897"/>
    <circle cx="903" cy="368" r="3" fill="#4b7897"/>
    <rect x="322" y="660" width="556" height="12" rx="4" fill="#183a54" stroke="#427292"/>
  </g>
  <g>
    <rect x="390" y="316" width="14" height="250" rx="4" fill="#20445f"/>
    <rect x="796" y="316" width="14" height="250" rx="4" fill="#20445f"/>
    <rect x="390" y="322" width="420" height="16" rx="5" fill="#2b5573" stroke="#5288a8"/>
    <rect x="558" y="332" width="60" height="60" rx="8" fill="#0b2033" stroke="#6bb9d6"/>
    <path d="M580 392h16l-6 22h-4z" fill="#b8d7e6"/>
    <circle cx="588" cy="360" r="6" fill="#22d3ee"/>
    <path d="M588 414v40" stroke="#7dd3fc" stroke-dasharray="4 6" stroke-opacity=".55"/>
  </g>
  <g>
    <rect x="432" y="596" width="336" height="22" rx="6" fill="#1b354c" stroke="#4f7f9f"/>
    <path d="M526 596h144l-14-30H540z" fill="#0e3c58" stroke="#2d89b5"/>
    <path d="M542 566h112l-12-28H554z" fill="url(#part)" opacity=".95"/>
    <path d="M558 538h80l-10-26h-60z" fill="#7dd3fc"/>
    <path d="M574 512h48l-9-22h-30z" fill="#e0f7ff"/>
    <path d="M432 618h336" stroke="#67e8f9" stroke-opacity=".3"/>
  </g>
  <g fill="none" stroke="#67e8f9" stroke-opacity=".35">
    <path d="M240 220v-50h50M960 650v50h-50"/>
    <circle cx="986" cy="200" r="26"/><path d="M986 174v-20M986 226v20M960 200h-20M1012 200h20"/>
  </g>
</svg>
