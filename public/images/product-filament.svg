<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Premium 3D printing filament spools</title>
  <desc id="desc">Three professional filament spools in charcoal, cyan and copper on a dark studio surface.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071321"/><stop offset=".6" stop-color="#0c1e30"/><stop offset="1" stop-color="#123047"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity=".32"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spoolCyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e7490"/><stop offset=".5" stop-color="#22d3ee"/><stop offset="1" stop-color="#155e75"/>
    </linearGradient>
    <linearGradient id="spoolCopper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9a5a2c"/><stop offset=".5" stop-color="#e8b17a"/><stop offset="1" stop-color="#7c4020"/>
    </linearGradient>
    <linearGradient id="spoolDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#243b51"/><stop offset=".5" stop-color="#547491"/><stop offset="1" stop-color="#16293b"/>
    </linearGradient>
    <linearGradient id="hub" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1c2c"/><stop offset="1" stop-color="#06111f"/>
    </linearGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#7fb9d8" stroke-opacity=".07"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="20" flood-color="#010812" flood-opacity=".75"/>
    </filter>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#grid)"/>
  <circle cx="600" cy="390" r="430" fill="url(#glow)"/>
  <path d="M0 700h1200" stroke="#4f8fb3" stroke-opacity=".14"/>
  <ellipse cx="600" cy="750" rx="430" ry="52" fill="#010812" opacity=".8" filter="url(#blur)"/>

  <g filter="url(#shadow)">
    <!-- back spool -->
    <g transform="translate(348 370) rotate(-14)">
      <circle r="164" fill="#0a1928" stroke="#315772" stroke-width="3"/>
      <circle r="142" fill="none" stroke="url(#spoolDark)" stroke-width="30"/>
      <circle r="142" fill="none" stroke="#89a9c0" stroke-opacity=".2" stroke-width="1"/>
      <circle r="96" fill="url(#hub)" stroke="#3b6684" stroke-width="2"/>
      <circle r="44" fill="#07131f" stroke="#2b4c66" stroke-width="2"/>
      <g stroke="#7dd3fc" stroke-opacity=".22">
        <path d="M0-96V96M-96 0H96" stroke-width="2"/>
        <circle r="70" fill="none"/>
      </g>
    </g>

    <!-- right spool -->
    <g transform="translate(806 392) rotate(12)">
      <circle r="158" fill="#0a1928" stroke="#4e6d85" stroke-width="3"/>
      <circle r="136" fill="none" stroke="url(#spoolCopper)" stroke-width="32"/>
      <circle r="136" fill="none" stroke="#f6d2ad" stroke-opacity=".2" stroke-width="1"/>
      <circle r="92" fill="url(#hub)" stroke="#3b6684" stroke-width="2"/>
      <circle r="42" fill="#07131f" stroke="#2b4c66" stroke-width="2"/>
      <path d="M-70-70L70 70M70-70L-70 70" stroke="#e8b17a" stroke-opacity=".15" stroke-width="2"/>
    </g>

    <!-- front spool -->
    <g transform="translate(590 470) rotate(-4)">
      <circle r="188" fill="#091827" stroke="#4b7a99" stroke-width="3"/>
      <circle r="160" fill="none" stroke="url(#spoolCyan)" stroke-width="40"/>
      <circle r="160" fill="none" stroke="#cffafe" stroke-opacity=".18" stroke-width="1.5"/>
      <circle r="110" fill="url(#hub)" stroke="#3f7393" stroke-width="2"/>
      <circle r="52" fill="#06121f" stroke="#2d536d" stroke-width="2"/>
      <circle r="52" fill="none" stroke="#22d3ee" stroke-opacity=".3"/>
      <g fill="none" stroke="#e0f7ff" stroke-opacity=".22" stroke-width="2">
        <circle r="92"/><circle r="132"/>
        <path d="M-110 0H110M0-110V110"/>
      </g>
      <path d="M160 60c100 24 160 88 204 178" fill="none" stroke="#67e8f9" stroke-width="3" stroke-opacity=".7"/>
      <path d="M160 60c100 24 160 88 204 178" fill="none" stroke="#22d3ee" stroke-width="12" stroke-opacity=".12"/>
    </g>
  </g>
  <g fill="none" stroke="#67e8f9" stroke-opacity=".3">
    <path d="M210 228h-44v44M990 262h44v44"/>
    <circle cx="1020" cy="620" r="26"/>
    <path d="M1020 594v-18M1020 646v18"/>
  </g>
</svg>
