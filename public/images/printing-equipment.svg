<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" role="img" aria-labelledby="title desc">
  <title id="title">Printing equipment showroom</title>
  <desc id="desc">A multifunction office copier, a desktop printer, paper and ink supplies on a warm neutral showroom floor.</desc>

  <!-- Room -->
  <rect width="1000" height="760" fill="#f7f2ec"/>
  <rect y="596" width="1000" height="164" fill="#eae1d8"/>
  <rect x="80" y="70" width="840" height="500" rx="28" fill="#f2ebe4"/>

  <!-- Floor shadows -->
  <ellipse cx="430" cy="656" rx="252" ry="20" fill="#d9cec3"/>
  <ellipse cx="805" cy="650" rx="140" ry="14" fill="#d9cec3"/>

  <!-- Large multifunction copier -->
  <rect x="250" y="628" width="44" height="24" rx="4" fill="#393534"/>
  <rect x="566" y="628" width="44" height="24" rx="4" fill="#393534"/>
  <rect x="220" y="268" width="420" height="362" rx="16" fill="#fbf8f4" stroke="#d8cec5" stroke-width="2"/>
  <rect x="220" y="470" width="420" height="160" rx="16" fill="#efe8e0"/>

  <!-- Paper drawers -->
  <rect x="250" y="500" width="360" height="48" rx="8" fill="#fbf8f4" stroke="#ddd3ca" stroke-width="2"/>
  <rect x="400" y="521" width="60" height="6" rx="3" fill="#a99e95"/>
  <rect x="250" y="564" width="360" height="48" rx="8" fill="#fbf8f4" stroke="#ddd3ca" stroke-width="2"/>
  <rect x="400" y="585" width="60" height="6" rx="3" fill="#a99e95"/>

  <!-- Scanner unit -->
  <rect x="235" y="178" width="390" height="30" rx="8" fill="#e8e0d7" stroke="#d5cbc2" stroke-width="2"/>
  <rect x="210" y="200" width="440" height="80" rx="12" fill="#fbf8f4" stroke="#d8cec5" stroke-width="2"/>
  <rect x="250" y="216" width="360" height="6" rx="3" fill="#cfc4ba"/>

  <!-- Control panel -->
  <rect x="518" y="222" width="112" height="46" rx="8" fill="#2f2c2d"/>
  <rect x="528" y="230" width="54" height="30" rx="4" fill="#4a4446"/>
  <rect x="534" y="236" width="34" height="4" rx="2" fill="#f7f2ec"/>
  <rect x="534" y="245" width="24" height="4" rx="2" fill="#b7aeaa"/>
  <circle cx="604" cy="239" r="5" fill="#cc1e5d"/>
  <circle cx="604" cy="253" r="5" fill="#f7f2ec"/>

  <!-- Printed sheet in the output tray -->
  <rect x="252" y="348" width="248" height="12" rx="6" fill="#cfc4ba"/>
  <rect x="286" y="306" width="180" height="44" rx="2" fill="#ffffff" stroke="#e2d8cf" stroke-width="2"/>
  <rect x="286" y="306" width="180" height="10" fill="#cc1e5d"/>
  <rect x="300" y="326" width="120" height="4" rx="2" fill="#d8cec5"/>
  <rect x="300" y="336" width="86" height="4" rx="2" fill="#d8cec5"/>

  <!-- Front accent and mark -->
  <rect x="220" y="418" width="420" height="6" fill="#cc1e5d"/>
  <circle cx="296" cy="450" r="11" fill="#cc1e5d"/>
  <rect x="318" y="444" width="54" height="6" rx="3" fill="#b9aea5"/>
  <rect x="318" y="456" width="34" height="5" rx="2.5" fill="#d3c8bf"/>

  <!-- Desktop printer on a side table -->
  <rect x="682" y="556" width="246" height="12" rx="6" fill="#d8cec5"/>
  <rect x="702" y="568" width="12" height="82" rx="4" fill="#cbc0b7"/>
  <rect x="896" y="568" width="12" height="82" rx="4" fill="#cbc0b7"/>
  <rect x="710" y="428" width="190" height="130" rx="12" fill="#fbf8f4" stroke="#d8cec5" stroke-width="2"/>
  <rect x="722" y="410" width="166" height="26" rx="8" fill="#e8e0d7" stroke="#d5cbc2" stroke-width="2"/>
  <rect x="748" y="462" width="114" height="46" rx="2" fill="#ffffff" stroke="#e2d8cf" stroke-width="2"/>
  <rect x="748" y="462" width="114" height="9" fill="#cc1e5d"/>
  <rect x="760" y="482" width="72" height="4" rx="2" fill="#d8cec5"/>
  <rect x="760" y="492" width="50" height="4" rx="2" fill="#d8cec5"/>
  <rect x="730" y="526" width="150" height="8" rx="4" fill="#cfc4ba"/>
  <circle cx="874" cy="446" r="6" fill="#cc1e5d"/>

  <!-- Supplies: cartons and ink bottles -->
  <rect x="86" y="470" width="104" height="48" rx="6" fill="#efe6dd" stroke="#d7ccc1" stroke-width="2"/>
  <rect x="70" y="518" width="128" height="112" rx="6" fill="#e3d8cc" stroke="#d2c6ba" stroke-width="2"/>
  <rect x="86" y="546" width="96" height="46" rx="3" fill="#fbf8f4"/>
  <rect x="96" y="558" width="26" height="22" rx="3" fill="#cc1e5d"/>
  <rect x="130" y="560" width="42" height="4" rx="2" fill="#d8cec5"/>
  <rect x="130" y="570" width="30" height="4" rx="2" fill="#d8cec5"/>
  <rect x="96" y="602" width="78" height="5" rx="2.5" fill="#cfc4ba"/>

  <rect x="96" y="424" width="24" height="42" rx="6" fill="#cc1e5d"/>
  <rect x="101" y="416" width="14" height="10" rx="3" fill="#a72353"/>
  <rect x="128" y="432" width="24" height="34" rx="6" fill="#bb3665"/>
  <rect x="133" y="424" width="14" height="10" rx="3" fill="#a72353"/>
  <rect x="160" y="428" width="24" height="38" rx="6" fill="#a72353"/>
  <rect x="165" y="420" width="14" height="10" rx="3" fill="#8a1036"/>

  <!-- Paper stack on the floor -->
  <rect x="642" y="626" width="86" height="8" rx="2" fill="#ffffff" stroke="#ddd3ca" stroke-width="1.5"/>
  <rect x="646" y="618" width="86" height="8" rx="2" fill="#fbf8f4" stroke="#ddd3ca" stroke-width="1.5"/>
  <rect x="650" y="610" width="86" height="8" rx="2" fill="#ffffff" stroke="#ddd3ca" stroke-width="1.5"/>
</svg>
