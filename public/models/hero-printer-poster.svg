<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" role="img" aria-labelledby="title desc">
  <title id="title">Industrial 3D printer illustration</title>
  <desc id="desc">A precision enclosed 3D printer producing a layered component in a dark technical environment.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0608"/>
      <stop offset=".55" stop-color="#120a0e"/>
      <stop offset="1" stop-color="#1a0d12"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#cc1e5d" stop-opacity=".42"/>
      <stop offset=".55" stop-color="#b41f54" stop-opacity=".12"/>
      <stop offset="1" stop-color="#b41f54" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2024"/>
      <stop offset=".35" stop-color="#1a1215"/>
      <stop offset="1" stop-color="#0b0708"/>
    </linearGradient>
    <linearGradient id="metalTop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#33272c"/>
      <stop offset="1" stop-color="#181114"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1216" stop-opacity=".9"/>
      <stop offset=".55" stop-color="#0f090b" stop-opacity=".88"/>
      <stop offset="1" stop-color="#221319" stop-opacity=".9"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b41f54" stop-opacity=".2"/>
      <stop offset=".5" stop-color="#f5a3c0"/>
      <stop offset="1" stop-color="#b41f54" stop-opacity=".2"/>
    </linearGradient>
    <linearGradient id="part" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0578c"/>
      <stop offset="1" stop-color="#8c1038"/>
    </linearGradient>
    <pattern id="grid" width="54" height="54" patternUnits="userSpaceOnUse">
      <path d="M54 0H0V54" fill="none" stroke="#d9b6c4" stroke-opacity=".09" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="30" stdDeviation="28" flood-color="#000000" flood-opacity=".75"/>
    </filter>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cc1e5d" stop-opacity=".8"/>
      <stop offset="1" stop-color="#cc1e5d" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="1000" fill="url(#bg)"/>
  <rect width="1200" height="1000" fill="url(#grid)" opacity=".7"/>
  <circle cx="850" cy="330" r="430" fill="url(#glow)"/>
  <path d="M0 870h1200" stroke="#8c7580" stroke-opacity=".18" stroke-width="1"/>
  <path d="M120 900h960" stroke="#8c7580" stroke-opacity=".08" stroke-width="1"/>

  <ellipse cx="700" cy="900" rx="360" ry="46" fill="#000000" opacity=".75" filter="url(#soft)"/>

  <!-- printer body -->
  <g filter="url(#shadow)">
    <rect x="374" y="238" width="652" height="572" rx="30" fill="url(#metal)" stroke="#3a2c31" stroke-width="2"/>
    <rect x="374" y="238" width="652" height="58" rx="28" fill="url(#metalTop)" stroke="#443238" stroke-width="1.5"/>
    <rect x="404" y="318" width="592" height="418" rx="18" fill="url(#glass)" stroke="#54323f" stroke-width="1.5"/>
    <!-- frame highlights -->
    <path d="M418 340h560" stroke="#f2a7c1" stroke-opacity=".25" stroke-width="2"/>
    <path d="M404 700h592" stroke="#cc1e5d" stroke-opacity=".7" stroke-width="2"/>
    <rect x="500" y="716" width="400" height="5" rx="2.5" fill="url(#cyan)"/>
    <!-- vent details -->
    <g stroke="#6f5a64" stroke-opacity=".45" stroke-width="2">
      <path d="M390 270h20M390 284h20M390 298h20"/>
      <path d="M990 270h-20M990 284h-20M990 298h-20"/>
    </g>
    <!-- side control panel -->
    <rect x="942" y="352" width="30" height="132" rx="8" fill="#120b0e" stroke="#4a3039"/>
    <circle cx="957" cy="380" r="5" fill="#cc1e5d"/>
    <circle cx="957" cy="404" r="3" fill="#5a4450"/>
    <circle cx="957" cy="424" r="3" fill="#5a4450"/>
    <rect x="950" y="448" width="14" height="22" rx="3" fill="#2a1620"/>
  </g>

  <!-- gantry and print head -->
  <g>
    <rect x="446" y="386" width="20" height="254" rx="5" fill="#241a1e" stroke="#5c4049"/>
    <rect x="934" y="386" width="20" height="254" rx="5" fill="#241a1e" stroke="#5c4049"/>
    <rect x="446" y="392" width="508" height="20" rx="6" fill="#2e2226" stroke="#7a6270"/>
    <rect x="638" y="404" width="72" height="66" rx="9" fill="#140e10" stroke="#a86e83"/>
    <path d="M662 470h24l-8 26h-8z" fill="#c4b2b9"/>
    <circle cx="674" cy="434" r="7" fill="#cc1e5d"/>
    <circle cx="674" cy="434" r="13" fill="none" stroke="#cc1e5d" stroke-opacity=".25"/>
    <path d="M674 496v40" stroke="#f2a7c1" stroke-opacity=".55" stroke-width="2" stroke-dasharray="4 7"/>
  </g>

  <!-- print bed and layered part -->
  <g>
    <rect x="494" y="658" width="412" height="24" rx="7" fill="#241b1f" stroke="#6f5a64"/>
    <rect x="508" y="650" width="384" height="10" rx="4" fill="#3a2b31"/>
    <g>
      <path d="M608 650h104l-10-26H618z" fill="#2a1620" stroke="#8c4059"/>
      <path d="M622 624h76l-8-24h-60z" fill="url(#part)" opacity=".92"/>
      <path d="M636 600h48l-7-22h-34z" fill="#f2a7c1" opacity=".9"/>
      <path d="M648 578h24l-5-18h-14z" fill="#fbeaf0"/>
      <path d="M596 650h128" stroke="#f5a3c0" stroke-opacity=".6" stroke-width="2"/>
      <path d="M622 624h76M636 600h48M648 578h24" stroke="#fbeaf0" stroke-opacity=".35" stroke-width="1.5"/>
    </g>
    <path d="M494 682h412" stroke="#f5a3c0" stroke-opacity=".28" stroke-width="2"/>
  </g>

  <!-- base -->
  <g>
    <rect x="350" y="758" width="700" height="102" rx="20" fill="url(#metal)" stroke="#3a2c31" stroke-width="1.5"/>
    <rect x="380" y="784" width="170" height="8" rx="4" fill="#cc1e5d" opacity=".65"/>
    <rect x="380" y="802" width="90" height="6" rx="3" fill="#6f5a64" opacity=".5"/>
    <circle cx="980" cy="806" r="18" fill="#120b0e" stroke="#4a3039"/>
    <circle cx="980" cy="806" r="6" fill="#cc1e5d" opacity=".8"/>
    <rect x="410" y="860" width="60" height="18" rx="6" fill="#0a0608"/>
    <rect x="930" y="860" width="60" height="18" rx="6" fill="#0a0608"/>
  </g>

  <!-- filament spool -->
  <g>
    <circle cx="214" cy="600" r="86" fill="#0b0708" stroke="#3a2b31" stroke-width="2"/>
    <circle cx="214" cy="600" r="64" fill="#1c1216" stroke="#5a3a46" stroke-width="1.5"/>
    <circle cx="214" cy="600" r="26" fill="#0a0607" stroke="#382a30"/>
    <circle cx="214" cy="600" r="54" fill="none" stroke="#cc1e5d" stroke-opacity=".55" stroke-width="7" stroke-dasharray="230 110"/>
    <path d="M296 580c66-26 94 12 130 62" fill="none" stroke="#f5a3c0" stroke-opacity=".65" stroke-width="3"/>
    <path d="M296 580c66-26 94 12 130 62" fill="none" stroke="#cc1e5d" stroke-opacity=".18" stroke-width="10"/>
    <path d="M132 664h164" stroke="#6f5a64" stroke-opacity=".45" stroke-width="2"/>
  </g>

  <!-- floating technical markers -->
  <g fill="none" stroke="#f5a3c0" stroke-opacity=".45">
    <circle cx="1052" cy="250" r="32"/>
    <circle cx="1052" cy="250" r="4" fill="#f5a3c0"/>
    <path d="M1052 218v-26M1052 282v26M1020 250h-26M1084 250h26"/>
    <path d="M340 210v-34h34M1030 730v34h-34"/>
  </g>
  <g fill="#f5a3c0">
    <circle cx="112" cy="322" r="3" opacity=".7"/>
    <circle cx="298" cy="196" r="2" opacity=".5"/>
    <circle cx="1106" cy="610" r="2.5" opacity=".6"/>
    <circle cx="972" cy="140" r="2" opacity=".4"/>
  </g>
  <path d="M90 760c80-8 130-44 150-104" fill="none" stroke="#cc1e5d" stroke-opacity=".18" stroke-width="1.5" stroke-dasharray="5 9"/>
</svg>
